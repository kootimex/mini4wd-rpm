<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mini RPM" />
  <title>Mini4WD RPM Checker</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 16px 20px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 13px; color: #888; }
    .container { padding: 16px; max-width: 480px; margin: 0 auto; }

    .rpm-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 20px 20px;
      text-align: center;
      margin-bottom: 12px;
      border: 1px solid #eee;
    }
    .main-label { font-size: 13px; color: #888; margin-bottom: 6px; }
    .main-number { font-size: 64px; font-weight: 600; color: #111; line-height: 1; }
    .main-unit { font-size: 16px; color: #888; margin-top: 4px; }
    .sub-display { font-size: 24px; font-weight: 500; color: #1D9E75; margin-top: 10px; }
    .sub-unit { font-size: 15px; color: #888; font-weight: 400; }
    .status-badge {
      display: inline-block;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 99px;
      margin-top: 14px;
      font-weight: 500;
    }
    .s-idle { background: #f0f0f0; color: #888; }
    .s-listening { background: #e8f5e9; color: #2e7d32; }
    .s-detected { background: #e0f2f1; color: #00695c; }

    .filter-bar {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid #eee;
      font-size: 13px;
    }
    .filter-title { color: #888; margin-bottom: 10px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .filter-row label { color: #888; width: 30px; text-align: right; flex-shrink: 0; }
    .filter-row input[type=range] { flex: 1; accent-color: #1D9E75; }
    .filter-row span { width: 52px; text-align: right; font-weight: 600; color: #111; flex-shrink: 0; }
    .filter-range-display { text-align: center; font-size: 12px; color: #1D9E75; margin-top: 4px; font-weight: 600; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      border: 1px solid #eee;
    }
    .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 600; color: #111; }
    .stat-sub { font-size: 12px; color: #1D9E75; margin-top: 3px; }

    .wave-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #eee;
    }
    canvas { width: 100%; height: 64px; display: block; }
    .canvas-label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-top: 4px; }

    .btn-row { display: flex; gap: 10px; }
    .btn-start {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #1D9E75;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-start:active { background: #157a5b; }
    .btn-start.active { background: #e53935; }
    .btn-start.active:active { background: #b71c1c; }
    .btn-reset {
      padding: 15px 18px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: #fff;
      font-size: 14px;
      color: #555;
      cursor: pointer;
    }
    .btn-reset:active { background: #f5f5f5; }
  </style>
</head>
<body>
<header>
  <h1>Mini4WD RPM</h1>
  <span>마이크 소리 분석</span>
</header>

<div class="container">
  <div class="rpm-card">
    <div class="main-label">현재 Hz</div>
    <div class="main-number" id="hzVal">—</div>
    <div class="main-unit">Hz</div>
    <div class="sub-display" id="rpmVal">— <span class="sub-unit">RPM</span></div>
    <div><span class="status-badge s-idle" id="statusBadge">대기 중</span></div>
  </div>

  <div class="filter-bar">
    <div class="filter-title">필터 범위</div>
    <div class="filter-row">
      <label>최소</label>
      <input type="range" id="minHz" min="100" max="900" step="10" value="300" oninput="updateFilter()">
      <span id="minHzVal">300 Hz</span>
    </div>
    <div class="filter-row">
      <label>최대</label>
      <input type="range" id="maxHz" min="100" max="900" step="10" value="700" oninput="updateFilter()">
      <span id="maxHzVal">700 Hz</span>
    </div>
    <div class="filter-range-display" id="filterDisplay">감지 범위: 300 ~ 700 Hz</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">최대 Hz</div>
      <div class="stat-value" id="maxHzStat">—</div>
      <div class="stat-sub" id="maxRpm">— RPM</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">평균 Hz</div>
      <div class="stat-value" id="avgHzStat">—</div>
      <div class="stat-sub" id="avgRpm">— RPM</div>
    </div>
  </div>

  <div class="wave-card">
    <canvas id="waveform"></canvas>
    <div class="canvas-label"><span>0 Hz</span><span>600 Hz</span><span>1200 Hz</span></div>
  </div>

  <div class="btn-row">
    <button class="btn-start" id="startBtn" onclick="toggleMic()">마이크 시작</button>
    <button class="btn-reset" onclick="resetStats()">초기화</button>
  </div>
</div>

<script>
let audioCtx, analyser, source, animId;
let isRunning = false;
let maxRpmVal = 0, maxHzStatVal = 0, rpmHistory = [], hzHistory = [], lastRpm = 0, lastHz = 0;
let filterMin = 300, filterMax = 700;

const canvas = document.getElementById("waveform");
const ctx2d = canvas.getContext("2d");
canvas.width = canvas.offsetWidth; canvas.height = 64;

function updateFilter() {
  filterMin = parseInt(document.getElementById("minHz").value);
  filterMax = parseInt(document.getElementById("maxHz").value);
  if (filterMin >= filterMax) { filterMax = filterMin + 10; document.getElementById("maxHz").value = filterMax; }
  document.getElementById("minHzVal").textContent = filterMin + " Hz";
  document.getElementById("maxHzVal").textContent = filterMax + " Hz";
  document.getElementById("filterDisplay").textContent = `감지 범위: ${filterMin} ~ ${filterMax} Hz`;
}

function dominantFreqInRange(analyser, sampleRate, minHz, maxHz) {
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);
  const minBin = Math.floor(minHz * analyser.fftSize / sampleRate);
  const maxBin = Math.ceil(maxHz * analyser.fftSize / sampleRate);
  let maxVal = 0, maxIdx = 0;
  for (let i = minBin; i <= maxBin && i < buf.length; i++) {
    if (buf[i] > maxVal) { maxVal = buf[i]; maxIdx = i; }
  }
  if (maxVal < 20) return 0;
  return maxIdx * sampleRate / analyser.fftSize;
}

function drawSpectrum() {
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);
  const sampleRate = audioCtx.sampleRate;
  const w = canvas.width, h = canvas.height;
  ctx2d.clearRect(0, 0, w, h);
  const displayMax = 1200;
  const maxBinDisp = Math.ceil(displayMax * analyser.fftSize / sampleRate);
  const filterMinBin = Math.floor(filterMin * analyser.fftSize / sampleRate);
  const filterMaxBin = Math.ceil(filterMax * analyser.fftSize / sampleRate);
  for (let i = 0; i <= maxBinDisp && i < buf.length; i++) {
    const x = Math.round(i / maxBinDisp * w);
    const barH = Math.round(buf[i] / 255 * h);
    ctx2d.fillStyle = (i >= filterMinBin && i <= filterMaxBin) ? "#1D9E75" : "rgba(150,150,150,0.25)";
    ctx2d.fillRect(x, h - barH, 2, barH);
  }
}

function loop() {
  if (!isRunning) return;
  drawSpectrum();
  const freq = dominantFreqInRange(analyser, audioCtx.sampleRate, filterMin, filterMax);
  if (freq > 0) {
    lastHz = Math.round(freq * 10) / 10;
    lastRpm = Math.round(freq * 60);
    hzHistory.push(lastHz); rpmHistory.push(lastRpm);
    if (hzHistory.length > 30) { hzHistory.shift(); rpmHistory.shift(); }
    if (lastRpm > maxRpmVal) { maxRpmVal = lastRpm; maxHzStatVal = lastHz; }
  } else {
    lastHz = 0; lastRpm = 0;
  }

  document.getElementById("hzVal").textContent = lastHz > 0 ? lastHz.toFixed(1) : "—";
  document.getElementById("rpmVal").innerHTML = lastRpm > 0 ? `${lastRpm.toLocaleString()} <span class="sub-unit">RPM</span>` : `— <span class="sub-unit">RPM</span>`;
  document.getElementById("maxHzStat").textContent = maxHzStatVal > 0 ? maxHzStatVal.toFixed(1) : "—";
  document.getElementById("maxRpm").textContent = maxRpmVal > 0 ? `${maxRpmVal.toLocaleString()} RPM` : "— RPM";
  if (hzHistory.length > 0) {
    const aHz = (hzHistory.reduce((a,b)=>a+b,0)/hzHistory.length).toFixed(1);
    const aRpm = Math.round(rpmHistory.reduce((a,b)=>a+b,0)/rpmHistory.length);
    document.getElementById("avgHzStat").textContent = aHz;
    document.getElementById("avgRpm").textContent = `${aRpm.toLocaleString()} RPM`;
  }

  const badge = document.getElementById("statusBadge");
  if (lastHz > 0) { badge.textContent = "감지됨"; badge.className = "status-badge s-detected"; }
  else { badge.textContent = "청취 중..."; badge.className = "status-badge s-listening"; }

  animId = requestAnimationFrame(loop);
}

async function toggleMic() {
  if (isRunning) {
    isRunning = false;
    cancelAnimationFrame(animId);
    if (source) source.disconnect();
    if (audioCtx) audioCtx.close();
    document.getElementById("startBtn").textContent = "마이크 시작";
    document.getElementById("startBtn").classList.remove("active");
    document.getElementById("statusBadge").textContent = "대기 중";
    document.getElementById("statusBadge").className = "status-badge s-idle";
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 8192;
    const biquad = audioCtx.createBiquadFilter();
    biquad.type = "bandpass";
    biquad.frequency.value = (filterMin + filterMax) / 2;
    biquad.Q.value = biquad.frequency.value / (filterMax - filterMin);
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(biquad);
    biquad.connect(analyser);
    isRunning = true;
    document.getElementById("startBtn").textContent = "측정 중지";
    document.getElementById("startBtn").classList.add("active");
    loop();
  } catch(e) {
    alert("마이크 접근 권한이 필요합니다.\n브라우저 설정에서 마이크를 허용해 주세요.");
  }
}

function resetStats() {
  maxRpmVal = 0; maxHzStatVal = 0; rpmHistory = []; hzHistory = []; lastRpm = 0; lastHz = 0;
  document.getElementById("hzVal").textContent = "—";
  document.getElementById("rpmVal").innerHTML = `— <span class="sub-unit">RPM</span>`;
  document.getElementById("maxHzStat").textContent = "—";
  document.getElementById("maxRpm").textContent = "— RPM";
  document.getElementById("avgHzStat").textContent = "—";
  document.getElementById("avgRpm").textContent = "— RPM";
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
